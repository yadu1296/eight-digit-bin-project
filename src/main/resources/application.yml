server:
  port: 8080

spring:
  application:
    name: eight-digit-bin
  datasource:
    url: jdbc:postgresql://localhost:5432/eight_digit_bin
    username: eightdigit
    password: eightdigit
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
